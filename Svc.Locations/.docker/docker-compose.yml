services:
  svc.locations:
    image: svc.locations
    hostname: svc-locations
    restart: on-failure
    ports:
      - 8080:8080
    build:
      context: ../Svc.Locations
      dockerfile: "Dockerfile.Local"
    depends_on:
      - database
      - eventing
    networks:
      - network

  database:
    image: mysql/mysql-server:latest
    ports:
      - 3306:3306
    networks:
      - network
    environment:
      MYSQL_ROOT_HOST: '%'
      MYSQL_ROOT_PASSWORD: myPassword_123

