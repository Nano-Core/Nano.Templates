name: Build And Deploy
on:
  pull_request:
    branches:
      - main 
  push:
    branches:
      - main 
  workflow_dispatch:
env:
  APP_NAME: Svc.Locations
  IMAGE_NAME: svc.locations
  SERVICE_NAME: svc-locations
  VERSION: '${{ vars.VERSION }}.${{ github.run_number }}.${{ github.run_attempt }}'
  DOTNET_SDK_VERSION: "10.0"
  DOTNET_ASPNET_VERSION: "10.0"
  DOTNET_EF_TOOLS_VERSION: "10.0"
  AZURE_GROUP_KUBERNETES: ${{ vars.AZURE_RESOURCE_GROUP_KUBERNETES }}
  AZURE_GROUP_DELIVERY: ${{ vars.AZURE_RESOURCE_GROUP_DELIVERY }}
  AZURE_GROUP_DATABASE : ${{ vars.AZURE_RESOURCE_GROUP_DATABASE }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  AZURE_SUBSCRIPTION_ID: ${{ github.ref == 'refs/heads/main' && secrets.PRODUCTION_AZURE_SUBSCRIPTION_ID || secrets.STAGING_AZURE_SUBSCRIPTION_ID }}
  NUGET_HOST: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
  NUGET_USERNAME: ${{ github.actor }}
  NUGET_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
  KUBERNETES_NODEPOOL_COMPUTE: cpu
  KUBERNETES_NAMESPACE: ${{ vars.KUBERNETES_NAMESPACE }}
  KUBERNETES_REPLICA_COUNT: ${{ github.ref == 'refs/heads/main' && 3 || 2 }}
  KUBERNETES_REPLICA_COUNT_MAX: ${{ github.ref == 'refs/heads/main' && 8 || 5 }}
  KUBERNETES_REPLICA_HISTORY_COUNT: 0
  KUBERNETES_MEMORY_REQUEST: 512Mi   
  KUBERNETES_MEMORY_LIMIT: 1536Mi
  KUBERNETES_MEMORY_SCALING: 180
  KUBERNETES_CPU_REQUEST: 150m
  KUBERNETES_CPU_LIMIT: 450m
  KUBERNETES_CPU_SCALING: 180
  SQL_TYPE: mysql
  SQL_AUTH_TYPE: Azure
  SQL_NAME: locationsDb
  ASPNETCORE_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Staging' }}
concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on:
      - self-hosted
      - linux 
      - ${{ github.ref == 'refs/heads/main' && 'Production' || 'Staging' }}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Azure Login
        shell: pwsh
        run: |
          az login --service-principal -u $env:AZURE_CLIENT_ID -p $env:AZURE_CLIENT_SECRET --tenant $env:AZURE_TENANT_ID -o none;
          az account set -s $env:AZURE_SUBSCRIPTION_ID -o none;

          $env:KUBERNETES_CLUSTER = az aks list -g $env:AZURE_GROUP_KUBERNETES --query [0].name -o tsv;
          az aks get-credentials -g $env:AZURE_GROUP_KUBERNETES -n $env:KUBERNETES_CLUSTER --overwrite -o none;

      - name: Build Solution
        shell: pwsh
        run: |
          dotnet nuget add source $env:NUGET_HOST -n private -u $env:NUGET_USERNAME -p $env:NUGET_PASSWORD --store-password-in-clear-text;

          dotnet build -c Release .\$env:APP_NAME.sln;

          if ($LastExitCode -ne 0)
          { 
              throw "error";
          };

      - name: Test Solution
        shell: pwsh
        run: |
          dotnet test .\.tests\Tests.$env:APP_NAME\Tests.$env:APP_NAME.csproj;

          if ($LastExitCode -ne 0)
          { 
            throw "error";
          };

      - name: Publish NuGet
        shell: pwsh
        run: |
          $nugetProjectModels=$env:APP_NAME + ".Models/" + $env:APP_NAME + ".Models.csproj";
          dotnet pack $nugetProjectModels -c Release --output nupkgs /p:PackageVersion=$env:VERSION --include-symbols --no-build;
          dotnet nuget push nupkgs/$env:APP_NAME".Models."$env:VERSION.nupkg -s $env:NUGET_HOST -k $env:NUGET_PASSWORD;

          if ($LastExitCode -ne 0) 
          { 
              throw "error";
          };  

          $nugetProjectEvents=$env:APP_NAME + ".Events/" + $env:APP_NAME + ".Events.csproj";
          dotnet pack $nugetProjectEvents -c Release --output nupkgs /p:PackageVersion=$env:VERSION --include-symbols --no-build;
          dotnet nuget push nupkgs/$env:APP_NAME".Events."$env:VERSION.nupkg -s $env:NUGET_HOST -k $env:NUGET_PASSWORD;

          if ($LastExitCode -ne 0) 
          { 
              throw "error";
          };  

      - name: Build & Push Image
        shell: pwsh
        run: |
          $env:CONTAINER_REGISTRY_HOST = az acr list -g $env:AZURE_GROUP_DELIVERY --query [0].loginServer -o tsv;

          az acr build `
              --registry $env:CONTAINER_REGISTRY_HOST `
              -t "$($env:IMAGE_NAME):latest" `
              -t "$($env:IMAGE_NAME):$($env:VERSION)" `
              --build-arg DOTNET_SDK_VERSION=$env:DOTNET_SDK_VERSION `
              --build-arg DOTNET_ASPNET_VERSION=$env:DOTNET_ASPNET_VERSION `
              --build-arg CONTAINER_REGISTRY_SOURCE_LABEL=https://github.com/$env:GITHUB_REPOSITORY `
              --build-arg NUGET_HOST=$env:NUGET_HOST `
              --build-arg NUGET_USERNAME=$env:NUGET_USERNAME `
              --build-arg NUGET_PASSWORD=$env:NUGET_PASSWORD `
              ./

          if ($LastExitCode -ne 0) 
          { 
              throw "error";
          };  

          echo "CONTAINER_REGISTRY_HOST=$env:CONTAINER_REGISTRY_HOST" >> $env:GITHUB_ENV;

      - name: Managed Identity
        shell: pwsh
        run: |
          $env:IDENTITY_NAME = $env:SERVICE_NAME + "-identity";
          $env:IDENTITY_PRINCIPAL_ID = az identity show -g $env:AZURE_GROUP_KUBERNETES -n $env:IDENTITY_NAME --query principalId -o tsv;
          $env:KUBERNETES_ISSUER_URL = az aks list -g $env:AZURE_GROUP_KUBERNETES --query [0].['oidcIssuerProfile.issuerUrl'] -o tsv;

          if (-not $env:IDENTITY_PRINCIPAL_ID)
          {
              az identity create `
                  -g $env:AZURE_GROUP_KUBERNETES `
                  -n $env:IDENTITY_NAME;

              if ($LastExitCode -ne 0)
              {
                  throw "error";
              };

              $env:IDENTITY_PRINCIPAL_ID = az identity show -g $env:AZURE_GROUP_KUBERNETES -n $env:IDENTITY_NAME --query principalId -o tsv;
          }
          
          $env:IDENTITY_CLIENT_ID = az identity show -g $env:AZURE_GROUP_KUBERNETES -n $env:IDENTITY_NAME --query clientId -o tsv;

          az identity federated-credential create `
              --name $env:SERVICE_NAME-credentials `
              --resource-group $env:AZURE_GROUP_KUBERNETES `
              --identity-name $env:IDENTITY_NAME `
              --issuer $env:KUBERNETES_ISSUER_URL `
              --subject "system:serviceaccount:${env:KUBERNETES_NAMESPACE}:${env:SERVICE_NAME}-service-account" `
              --audience api://AzureADTokenExchange;

          if ($LastExitCode -ne 0)
          {
              throw "error";
          };
          
          echo "IDENTITY_NAME=$env:IDENTITY_NAME" >> $env:GITHUB_ENV;
          echo "IDENTITY_CLIENT_ID=$env:IDENTITY_CLIENT_ID" >> $env:GITHUB_ENV; 
          echo "IDENTITY_PRINCIPAL_ID=$env:IDENTITY_PRINCIPAL_ID" >> $env:GITHUB_ENV; 

      - name: MySQL Database Migration
        if: env.SQL_TYPE == 'mysql'
        shell: pwsh
        run: |
          $env:SQL_HOST = az mysql flexible-server list -g $env:AZURE_GROUP_DATABASE --query [0].fullyQualifiedDomainName -o tsv;
          $env:SQL_PORT = az mysql flexible-server list -g $env:AZURE_GROUP_DATABASE --query [0].databasePort -o tsv;
          $env:SQL_SERVER = az mysql flexible-server list -g $env:AZURE_GROUP_DATABASE --query [0].name -o tsv;
          $env:SQL_USER = az mysql flexible-server ad-admin list -g $env:AZURE_GROUP_DATABASE -s $env:SQL_SERVER --query "[0].login" -o tsv;
          $env:SQL_TOKEN = az account get-access-token --resource-type oss-rdbms --query accessToken -o tsv;

          $env:DATA__CONNECTIONSTRING = "Server=$env:SQL_HOST;Port=$env:SQL_PORT;Database=$env:SQL_NAME;Uid=$env:SQL_USER;Pwd=$env:SQL_TOKEN;SslMode=Required";

          & "/opt/ef-tools/$env:DOTNET_EF_TOOLS_VERSION/dotnet-ef" database update `
              --no-build `
              --configuration Release `
              --startup-project $env:APP_NAME `
              -- `
              --environment $env:ASPNETCORE_ENVIRONMENT;

          if ($LastExitCode -ne 0)
          { 
              throw "error";
          };

          $env:APP_USER_SQL_PATH = "app-database-user.sql";

          $sql = @"
            CREATE AADUSER IF NOT EXISTS '$env:IDENTITY_NAME' IDENTIFIED BY '$env:IDENTITY_CLIENT_ID';
            GRANT SELECT, INSERT, UPDATE, DELETE ON $env:SQL_NAME.* TO '$env:IDENTITY_NAME'@'%';
            FLUSH PRIVILEGES;
          "@;

          $sql | Set-Content $env:APP_USER_SQL_PATH;

          az mysql flexible-server execute `
              -n $env:SQL_SERVER `
              -u $env:SQL_USER `
              -p $env:SQL_TOKEN `
              --file-path $env:APP_USER_SQL_PATH;

          if ($LastExitCode -ne 0)
          {
              throw "error";
          };

          $env:SQL_CONNECTIONSTRING = "Server=$env:SQL_HOST;Port=$env:SQL_PORT;Database=$env:SQL_NAME;Uid=$env:IDENTITY_NAME;SslMode=Required";
          echo "SQL_CONNECTIONSTRING=$env:SQL_CONNECTIONSTRING" >> $env:GITHUB_ENV;

      - name: PostgreSQL Database Migration
        if: env.SQL_TYPE == 'postgresql'
        shell: pwsh
        run: |
          $env:SQL_HOST = az postgres flexible-server list -g $env:AZURE_GROUP_DATABASE --query [0].fullyQualifiedDomainName -o tsv;
          $env:SQL_PORT = 5432;
          $env:SQL_SERVER = az postgres flexible-server list -g $env:AZURE_GROUP_DATABASE --query [0].name -o tsv;
          $env:SQL_USER = az postgres flexible-server ad-admin list -g $env:AZURE_GROUP_DATABASE -s $env:SQL_SERVER --query "[0].principalName" -o tsv;
          $env:SQL_TOKEN = az account get-access-token --resource-type oss-rdbms --query accessToken -o tsv;

          $env:DATA__CONNECTIONSTRING = "Host=$env:SQL_HOST;Port=$env:SQL_PORT;Database=$env:SQL_NAME;Username=$env:SQL_USER;Password=$env:SQL_TOKEN;SSL Mode=Require;Trust Server Certificate=true";

          & "/opt/ef-tools/$env:DOTNET_EF_TOOLS_VERSION/dotnet-ef" database update `
              --no-build `
              --configuration Release `
              --startup-project $env:APP_NAME `
              -- `
              --environment $env:ASPNETCORE_ENVIRONMENT;

          if ($LastExitCode -ne 0)
          {
              throw "error";
          };

          $env:PRINCIPAL_SQL_PATH = "app-database-principal.sql";
          $env:GRANTS_SQL_PATH = "app-database-grants.sql";

          $principalSql = @"
            DO `$`$
            BEGIN
              IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '$env:IDENTITY_NAME') THEN
                PERFORM pgaadauth_create_principal('$env:IDENTITY_NAME', false, false);
              END IF;
            END
            `$`$;
          "@;

          $principalSql | Set-Content $env:PRINCIPAL_SQL_PATH;

          az postgres flexible-server execute `
              -n $env:SQL_SERVER `
              -u $env:SQL_USER `
              -p $env:SQL_TOKEN `
              -d postgres `
              --file-path $env:PRINCIPAL_SQL_PATH;

          if ($LastExitCode -ne 0)
          {
              throw "error";
          };

          $grantsSql = @"
            GRANT CONNECT ON DATABASE $env:SQL_NAME TO "$env:IDENTITY_NAME";
            GRANT USAGE ON SCHEMA public TO "$env:IDENTITY_NAME";
            GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO "$env:IDENTITY_NAME";
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO "$env:IDENTITY_NAME";
          "@;

          $grantsSql | Set-Content $env:GRANTS_SQL_PATH;

          az postgres flexible-server execute `
              -n $env:SQL_SERVER `
              -u $env:SQL_USER `
              -p $env:SQL_TOKEN `
              -d $env:SQL_NAME `
              --file-path $env:GRANTS_SQL_PATH;

          if ($LastExitCode -ne 0)
          {
              throw "error";
          };

          $env:SQL_CONNECTIONSTRING = "Host=$env:SQL_HOST;Port=$env:SQL_PORT;Database=$env:SQL_NAME;Username=$env:IDENTITY_NAME;SSL Mode=Require;Trust Server Certificate=true";
          echo "SQL_CONNECTIONSTRING=$env:SQL_CONNECTIONSTRING" >> $env:GITHUB_ENV;

      - name: SQL Server Create Database
        if: env.SQL_TYPE == 'sqlserver'
        shell: pwsh
        run: |
          $env:SQL_SERVER_NAME = az sql server list -g $env:AZURE_GROUP_DATABASE --query "[0].name" -o tsv;
          $env:SQL_DB_EXISTS = az sql db show -g $env:AZURE_GROUP_DATABASE -s $env:SQL_SERVER_NAME -n $env:SQL_NAME --query name -o tsv 2>$null;

          if (-not $env:SQL_DB_EXISTS)
          {
              az sql db create `
                  -n $env:SQL_NAME `
                  -s $env:SQL_SERVER_NAME `
                  -g $env:AZURE_GROUP_DATABASE `
                  --edition $env:SQL_EDITION `
                  --service-objective $env:SQL_SERVICE_OBJECTIVE `
                  --max-size $env:SQL_MAX_SIZE `
                  --backup-storage-redundancy Geo `
                  --zone-redundant true;

              $env:MAINTENANCE_CONFIG_ID = az maintenance public-configuration list --query "[?name=='SQL_Default_1'].id" -o tsv;

              az sql db update `
                  -n $env:SQL_NAME `
                  -s $env:SQL_SERVER_NAME `
                  -g $env:AZURE_GROUP_DATABASE `
                  --maint-config-id $env:MAINTENANCE_CONFIG_ID;

              $env:DIAGNOSTIC_SETTINGS_NAME = "diagnostics-" + $env:SQL_NAME;
              $env:WORKSPACE_ID = az monitor log-analytics workspace list -g $env:AZURE_GROUP_LOGS --query [0].[id] -o tsv;
              $env:SQLDB_ID = az sql db show -g $env:AZURE_GROUP_DATABASE -s $env:SQL_SERVER_NAME -n $env:SQL_NAME --query id -o tsv;

              az monitor diagnostic-settings create `
                  --name $env:DIAGNOSTIC_SETTINGS_NAME `
                  --resource $env:SQLDB_ID `
                  --workspace $env:WORKSPACE_ID `
                  --logs '@.azure/.diagnostic-settings/logs.json' `
                  --metrics '@.azure/.diagnostic-settings/metrics.json';

              $env:ACTION_GROUP = az monitor action-group list -g $env:AZURE_GROUP_LOGS --query [0].[id] -o tsv;

              az monitor metrics alert create `
                  --name "High CPU Usage" `
                  --resource-group $env:AZURE_GROUP_DATABASE `
                  --scopes $env:SQLDB_ID `
                  --condition "avg cpu_percent > 80" `
                  --window-size PT5M `
                  --evaluation-frequency PT1M `
                  --action $env:ACTION_GROUP `
                  --severity 2 `
                  --description "Alert when CPU usage is above 80% for 5 minutes.";

              az monitor metrics alert create `
                  --name "High Memory/Worker Usage" `
                  --resource-group $env:AZURE_GROUP_DATABASE `
                  --scopes $env:SQLDB_ID `
                  --condition "avg workers_percent > 80" `
                  --window-size PT5M `
                  --evaluation-frequency PT1M `
                  --action $env:ACTION_GROUP `
                  --severity 2 `
                  --description "Alert when worker/session usage is above 80% for 5 minutes.";

              az monitor metrics alert create `
                  --name "High Number Of Connections" `
                  --resource-group $env:AZURE_GROUP_DATABASE `
                  --scopes $env:SQLDB_ID `
                  --condition "total connection_successful > 100" `
                  --window-size PT5M `
                  --evaluation-frequency PT1M `
                  --action $env:ACTION_GROUP `
                  --severity 2 `
                  --description "Alert when the number of successful connections exceeds 100 in 5 minutes.";

              az monitor metrics alert create `
                  --name "High Storage IO" `
                  --resource-group $env:AZURE_GROUP_DATABASE `
                  --scopes $env:SQLDB_ID `
                  --condition "avg io_consumption_percent > 80" `
                  --window-size PT5M `
                  --evaluation-frequency PT1M `
                  --action $env:ACTION_GROUP `
                  --severity 2 `
                  --description "Alert when Storage IO consumption is above 80% for 5 minutes.";

              az monitor metrics alert create `
                  --name "High Storage Percent" `
                  --resource-group $env:AZURE_GROUP_DATABASE `
                  --scopes $env:SQLDB_ID `
                  --condition "avg storage_percent > 80" `
                  --window-size PT5M `
                  --evaluation-frequency PT1M `
                  --action $env:ACTION_GROUP `
                  --severity 2 `
                  --description "Alert when Storage usage exceeds 80% for 5 minutes.";

              az sql db str-policy set `
                  -g $env:AZURE_GROUP_DATABASE `
                  -s $env:SQL_SERVER_NAME `
                  -n $env:SQL_NAME `
                  --retention-days $env:SQL_BACKUP_RETENTION;

              if ($LastExitCode -ne 0)
              { 
                  throw "error";
              };
          };

      - name: SQL Server Database Migration
        if: env.SQL_TYPE == 'sqlserver'
        shell: pwsh
        run: |
          $env:SQL_HOST = az sql server list -g $env:AZURE_GROUP_DATABASE --query [0].fullyQualifiedDomainName -o tsv;
          $env:SQL_PORT = 1433;
          $env:SQL_SERVER = az sql server list -g $env:AZURE_GROUP_DATABASE --query [0].name -o tsv;
          $env:SQL_USER = az sql server ad-admin list -g $env:AZURE_GROUP_DATABASE -s $env:SQL_SERVER --query "[0].login" -o tsv;
          $env:SQL_TOKEN = az account get-access-token --resource "https://database.windows.net/" --query accessToken -o tsv;

          $env:DATA__CONNECTIONSTRING = "Server=$env:SQL_HOST,$env:SQL_PORT;Database=$env:SQL_NAME;User Id=$env:SQL_USER;Password=$env:SQL_TOKEN;Encrypt=True;TrustServerCertificate=True;";

          & "/opt/ef-tools/$env:DOTNET_EF_TOOLS_VERSION/dotnet-ef" database update `
              --no-build `
              --configuration Release `
              --startup-project $env:APP_NAME `
              -- `
              --environment $env:ASPNETCORE_ENVIRONMENT;

          if ($LastExitCode -ne 0)
          { 
              throw "error";
          };

          $env:APP_USER_SQL_PATH = "app-database-user.sql";

          $sql = @"
            IF NOT EXISTS (SELECT 1 FROM sys.database_principals WHERE name = '$env:IDENTITY_NAME')
            BEGIN
                CREATE USER [$env:IDENTITY_NAME] FROM EXTERNAL PROVIDER;
            END

            IF NOT EXISTS (SELECT 1 FROM sys.database_role_members drm
                JOIN sys.database_principals r ON drm.role_principal_id = r.principal_id
                JOIN sys.database_principals m ON drm.member_principal_id = m.principal_id
                WHERE r.name = 'db_datareader' AND m.name = '$env:IDENTITY_NAME')
            BEGIN
                ALTER ROLE db_datareader ADD MEMBER [$env:IDENTITY_NAME];
            END

            IF NOT EXISTS (SELECT 1 FROM sys.database_role_members drm
                JOIN sys.database_principals r ON drm.role_principal_id = r.principal_id
                JOIN sys.database_principals m ON drm.member_principal_id = m.principal_id
                WHERE r.name = 'db_datawriter' AND m.name = '$env:IDENTITY_NAME')
            BEGIN
                ALTER ROLE db_datawriter ADD MEMBER [$env:IDENTITY_NAME];
            END
          "@;

          $sql | Set-Content $env:APP_USER_SQL_PATH;

          Install-Module -Name SqlServer -Scope CurrentUser;

          Invoke-Sqlcmd `
              -ServerInstance $env:SQL_HOST `
              -Database $env:SQL_NAME `
              -AccessToken $env:SQL_TOKEN `
              -InputFile $env:APP_USER_SQL_PATH;

          if ($LastExitCode -ne 0)
          {
              throw "error";
          };

          $env:SQL_CONNECTIONSTRING = "Server=$env:SQL_HOST,$env:SQL_PORT;Database=$env:SQL_NAME;User Id=$env:IDENTITY_NAME;Encrypt=True;TrustServerCertificate=True;";
          echo "SQL_CONNECTIONSTRING=$env:SQL_CONNECTIONSTRING" >> $env:GITHUB_ENV;

      - name: Kubernetes Deploy
        shell: pwsh
        run: |
          Get-Content .kubernetes/auth-sql-secret.yaml | foreach { [Environment]::ExpandEnvironmentVariables($_) } | Set-Content .kubernetes/auth-sql-secret.tmp.yaml;
          kubectl apply -f .kubernetes/auth-sql-secret.tmp.yaml;
          if ($LastExitCode -ne 0)
          { 
              throw "error";
          };

          Get-Content .kubernetes/service.yaml | foreach { [Environment]::ExpandEnvironmentVariables($_) } | Set-Content .kubernetes/service.tmp.yaml;
          kubectl apply -f .kubernetes/service.tmp.yaml;
          if ($LastExitCode -ne 0)
          { 
              throw "error";
          };

          Get-Content .kubernetes/configmap.yaml | foreach { [Environment]::ExpandEnvironmentVariables($_) } | Set-Content .kubernetes/configmap.tmp.yaml;
          kubectl apply -f .kubernetes/configmap.tmp.yaml;
          if ($LastExitCode -ne 0)
          { 
              throw "error";
          };

          Get-Content .kubernetes/deployment.yaml | foreach { [Environment]::ExpandEnvironmentVariables($_) } | Set-Content .kubernetes/deployment.tmp.yaml;
          kubectl apply -f .kubernetes/deployment.tmp.yaml;
          if ($LastExitCode -ne 0)
          { 
              throw "error";
          };

          Get-Content .kubernetes/autoscaler.yaml | foreach { [Environment]::ExpandEnvironmentVariables($_) } | Set-Content .kubernetes/autoscaler.tmp.yaml;
          kubectl apply -f .kubernetes/autoscaler.tmp.yaml;
          if ($LastExitCode -ne 0)
          { 
              throw "error";
          };

          Get-Content .kubernetes/service-monitor.yaml | foreach { [Environment]::ExpandEnvironmentVariables($_) } | Set-Content .kubernetes/service-monitor.tmp.yaml;
          kubectl apply -f .kubernetes/service-monitor.tmp.yaml;
          if ($LastExitCode -ne 0)
          { 
              throw "error";
          };

      - name: GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.VERSION }}
          name: "Release ${{ env.VERSION }}"
          body: |
            Version: ${{ env.VERSION }}
            Commit: ${{ github.sha }}
            Build run: ${{ github.run_number }}
            Image: ${{ env.CONTAINER_REGISTRY_HOST }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          artifacts: "nupkgs/*"
          token: ${{ secrets.GITHUB_TOKEN }}
          draft: false
          prerelease: false

      - name: Slack Notification
        if: always()
        uses: act10ns/slack@v2
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          config: .github/config/slack.yml
          status: ${{ job.status }}
          channel: ${{ vars.SLACK_CHANNEL }}